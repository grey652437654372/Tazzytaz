<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connell Detailing</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a0a;
  --text:#fff;
  --muted:#b8b8b8;
  --border:rgba(255,255,255,0.08);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

html{scroll-behavior:smooth;}

body{
  background:radial-gradient(circle at top,#1a1a1a,#0a0a0a 60%);
  color:var(--text);
}

.container{
  max-width:1000px;
  margin:auto;
  padding:0 20px;
}

.header{
  text-align:center;
  padding:60px 20px 20px;
}

.logo{
  width:82px;
  height:82px;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(255,255,255,0.05);
  border:2px solid rgba(255,255,255,0.25);
  overflow:hidden;
}

/* ✅ FIXED LOGO SIZING */
.logo img{
  width:70%;
  height:70%;
  object-fit:contain;
}

.title{
  font-size:38px;
  font-weight:800;
}

.tagline{
  color:var(--muted);
  margin-top:8px;
  font-size:14px;
}

nav{
  display:flex;
  justify-content:center;
  gap:12px;
  padding:14px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
  z-index:10;
}

nav a{
  text-decoration:none;
  color:var(--muted);
  padding:8px 12px;
  border-radius:8px;
}

nav a:hover{
  color:#fff;
  background:rgba(255,255,255,0.08);
}

section{padding:100px 0;}

.section-title{
  text-align:center;
  font-size:28px;
  margin-bottom:40px;
}

.hero{
  text-align:center;
  max-width:650px;
  margin:auto;
}

.hero h2{font-size:34px;}

.hero p{
  color:var(--muted);
  margin-top:10px;
}

.cta,.submit{
  margin-top:20px;
  padding:14px 24px;
  background:#fff;
  color:#000;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:0.2s ease;
}

.cta:hover,.submit:hover{
  transform:scale(1.05);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
}

.card{
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:all 0.3s ease;
}

.card:hover{
  transform:translateY(-12px) scale(1.02);
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

.card p{
  color:var(--muted);
  line-height:1.5;
}

form{
  max-width:500px;
  margin:40px auto 0;
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  background:#0f0f0f;
  border:1px solid #333;
  color:#fff;
  border-radius:8px;
}

.contact{
  text-align:center;
  color:var(--muted);
  margin-top:20px;
  line-height:30px;
}

.fade-in{
  opacity:0;
  transform:translateY(40px);
  transition:all 0.8s ease;
}

.fade-in.visible{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <img src="images/logo.png" alt="Connell Detailing Logo">
  </div>

  <div class="title">Connell Detailing</div>
  <div class="tagline">Mobile Car Detailing • Senoia, GA</div>
</div>

<nav>
  <a href="#home">Home</a>
  <a href="#gallery">Gallery</a>
  <a href="#services">Services</a>
  <a href="#reviews">Reviews</a>
  <a href="#book">Book</a>
  <a href="#contact">Contact</a>
</nav>

<section id="home" class="fade-in">
  <div class="container">
    <div class="hero">
      <p style="color:#b8b8b8; font-size:13px; margin-bottom:10px;">
        || Customer Provides Driveway Space & Water Access ||
      </p>

      <h2>Mobile Car Detailing in Senoia, GA</h2>
      <p>We come to your driveway and make your car look like new — fast, affordable, and reliable.</p>

      <button class="cta" onclick="document.getElementById('book').scrollIntoView()">Book Now</button>
    </div>
  </div>
</section>

</body>
</html>
