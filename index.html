<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tazzy Auto Detailing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
    }

    header {
      background: #111;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 2px;
      border-bottom: 1px solid #333;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }

    nav a {
      padding: 14px 20px;
      color: #aaa;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    nav a:hover {
      color: white;
      background: #333;
    }

    section {
      padding: 50px 20px;
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* SERVICES */
    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .service-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
    }

    .service-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #888;
      box-shadow: 0 0 20px rgba(255,255,255,0.08);
    }

    .service-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .price {
      opacity: 0;
      transform: translateY(10px);
      transition: 0.3s ease;
      font-size: 16px;
      color: #aaa;
    }

    .service-card:hover .price {
      opacity: 1;
      transform: translateY(0);
      color: white;
    }

    /* CONTACT */
    .contact-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      color: #ddd;
      font-size: 15px;
    }

    .icon {
      width: 12px;
      height: 12px;
      min-width: 12px;
      min-height: 12px;
      flex-shrink: 0;
      opacity: 0.8;
    }

  </style>
</head>

<body>

<header>Tazzy Auto Detailing</header>

<nav>
  <a href="#" onclick="showSection('home')">Home</a>
  <a href="#" onclick="showSection('contact')">Contact</a>
</nav>

<!-- HOME -->
<section id="home" class="active">
  <h2 style="text-align:center;">Our Services</h2>

  <div class="services">

    <div class="service-card">
      <div class="service-title">Basic Wash</div>
      <div class="price">$25</div>
    </div>

    <div class="service-card">
      <div class="service-title">Interior Detail</div>
      <div class="price">$60</div>
    </div>

    <div class="service-card">
      <div class="service-title">Full Detail</div>
      <div class="price">$120</div>
    </div>

    <div class="service-card">
      <div class="service-title">Wax & Shine</div>
      <div class="price">$80</div>
    </div>

  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <h2 style="text-align:center;">Contact</h2>

  <div style="max-width:600px; margin:auto;">

    <p class="contact-line">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M6 10c2 4 4 6 8 8" stroke="white" stroke-width="1.5" fill="none"/>
      </svg>
      Phone: (123) 456-7890
    </p>

    <p class="contact-line">
      <svg viewBox="0 0 24 24" class="icon">
        <rect x="3" y="5" width="18" height="14" rx="3" stroke="white" stroke-width="1.5" fill="none"/>
        <path d="M3 7l9 6 9-6" stroke="white" stroke-width="1.5"/>
      </svg>
      Email: tazzydetailing@email.com
    </p>

    <p class="contact-line">
      <svg viewBox="0 0 24 24" class="icon">
        <rect x="3" y="3" width="18" height="18" rx="5" stroke="white" stroke-width="1.5" fill="none"/>
        <circle cx="12" cy="12" r="4" stroke="white" stroke-width="1.5" fill="none"/>
        <circle cx="17.5" cy="6.5" r="1" fill="white"/>
      </svg>
      Instagram: @tazzydetail
    </p>

  </div>
</section>

<script>
function showSection(id) {
  document.querySelectorAll("section").forEach(sec => sec.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
